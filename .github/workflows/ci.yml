name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # The Android app needs the SDK and the Stockfish binary, so CI builds and tests :core only.
      - name: Run core tests
        run: ./gradlew :core:test --no-daemon -Ppostmortem.coreOnly=true
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-test-report
          path: core/build/reports/tests/test
