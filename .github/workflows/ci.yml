name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job, id `ci` and no `name:`: the check the `main` ruleset requires is called `ci`.
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Folders for downloads and the debug keystore
        run: |
          echo "LAB_CACHE=$RUNNER_TEMP/lab-cache" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/android-user"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: lab-cache
        with:
          path: ${{ runner.temp }}/lab-cache
          key: lab-cache-${{ hashFiles('scripts/lab/stockfish.env') }}
      # compileSdk comes from gradle.properties; the runner image may not have that platform yet.
      - name: Android SDK platform
        run: |
          compile_sdk=$(sed -n 's/^postmortem.compileSdk=//p' gradle.properties)
          build_tools=$(sed -n 's/^postmortem.buildTools=//p' gradle.properties)
          yes | sudo -E "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          sudo -E "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-${compile_sdk}.0" "build-tools;${build_tools}"
      # The phone's engine is built from source with this NDK (16 KB pages); the build is cached with the downloads.
      - name: Android NDK (only when the engine is not cached)
        if: steps.lab-cache.outputs.cache-hit != 'true'
        run: |
          set -a; source scripts/lab/stockfish.env; set +a
          sudo -E "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${STOCKFISH_ANDROID_NDK}"
      - name: Prepare (the pinned Stockfish binaries)
        run: |
          mkdir -p "$LAB_CACHE"
          if [ -x scripts/lab/prepare ]; then scripts/lab/prepare; fi
      - name: Build, test and lint
        run: ./gradlew assembleDebug test lint spotlessCheck --no-daemon
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            core/build/reports/tests/test
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
