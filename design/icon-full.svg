<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <defs>
    <radialGradient id="bg" cx="38%" cy="32%" r="85%">
      <stop offset="0" stop-color="#262d3b"/>
      <stop offset="1" stop-color="#0d1016"/>
    </radialGradient>
    <radialGradient id="glass" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#2d5b49"/>
      <stop offset="1" stop-color="#132a24"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c5634"/>
      <stop offset="1" stop-color="#55301a"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecca74"/>
      <stop offset="0.55" stop-color="#c49a45"/>
      <stop offset="1" stop-color="#8a6526"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4eedd"/>
      <stop offset="1" stop-color="#d6cbb0"/>
    </linearGradient>
    <pattern id="board" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#ffffff"/>
      <rect x="6" y="6" width="6" height="6" fill="#ffffff"/>
    </pattern>
    <clipPath id="lens"><circle cx="48" cy="48" r="19"/></clipPath>
  </defs>

  <rect width="108" height="108" fill="url(#bg)"/>

  <!-- handle -->
  <line x1="66.4" y1="66.4" x2="74.6" y2="74.6" stroke="#20160e" stroke-width="8.4" stroke-linecap="round"/>
  <line x1="66.4" y1="66.4" x2="74.6" y2="74.6" stroke="#4a3220" stroke-width="6.6" stroke-linecap="round"/>
  <line x1="67.6" y1="66.6" x2="73.8" y2="72.8" stroke="#6e4c30" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="62.6" y1="62.6" x2="66.6" y2="66.6" stroke="url(#brass)" stroke-width="6.4" stroke-linecap="butt"/>

  <!-- lens contents -->
  <g clip-path="url(#lens)">
    <circle cx="48" cy="48" r="19" fill="url(#glass)"/>
    <rect x="29" y="29" width="38" height="38" fill="url(#board)" opacity="0.06"/>

    <g transform="translate(48 50.5) scale(0.8) translate(-50 -50)" stroke="#1a140e" stroke-width="0.6" stroke-linejoin="round">
      <!-- lid leaning on the left -->
      <rect x="28.5" y="44" width="4.6" height="23" rx="1" fill="url(#wood)" transform="rotate(-18 30.8 67)"/>
      <!-- coffin lining (back rim) -->
      <polygon points="34,58.4 66,58.4 67.6,61.6 32.4,61.6" fill="#7c2639"/>

      <!-- skeleton king -->
      <g transform="rotate(7 50 63)">
      <g fill="url(#bone)">
        <path d="M46.6 50.2 L53.4 50.2 L57.2 62.4 L42.8 62.4 Z"/>
        <rect x="45.4" y="48.3" width="9.2" height="2" rx="0.7"/>
        <path d="M44.6 43 a5.4 5.4 0 1 1 10.8 0 c0 2 -1 3.2 -2.2 3.8 v1.6 h-6.4 v-1.6 c-1.2 -0.6 -2.2 -1.8 -2.2 -3.8 z"/>
        <path d="M44.6 38.6 L43.5 33.8 L46.8 35.9 L50 32.7 L53.2 35.9 L56.5 33.8 L55.4 38.6 Z"/>
        <rect x="49.05" y="26.8" width="1.9" height="6.4" rx="0.4"/>
        <rect x="46.9" y="28.7" width="6.2" height="1.9" rx="0.4"/>
      </g>
      <g fill="none" stroke="#2a2118" stroke-width="0.65" stroke-linecap="round">
        <path d="M50 50.8 V61.6"/>
        <path d="M47 52.7 Q50 53.9 53 52.7"/>
        <path d="M46.3 55.2 Q50 56.5 53.7 55.2"/>
        <path d="M45.6 57.7 Q50 59.1 54.4 57.7"/>
        <path d="M48 47.1 V48.2 M49.35 47.1 V48.2 M50.65 47.1 V48.2 M52 47.1 V48.2"/>
      </g>
      <g fill="#17110c" stroke="none">
        <ellipse cx="47.9" cy="42.6" rx="1.45" ry="1.6"/>
        <ellipse cx="52.1" cy="42.6" rx="1.45" ry="1.6"/>
        <path d="M50 44.2 l-0.85 1.5 h1.7 z"/>
      </g>
      </g>

      <!-- coffin front wall -->
      <polygon points="32.4,61.6 67.6,61.6 64.6,69.8 35.4,69.8" fill="url(#wood)"/>
      <rect x="46.6" y="64.4" width="6.8" height="2" rx="0.5" fill="url(#brass)" stroke-width="0.4"/>

      <!-- forensic tweezers pulling the king out by the cross -->
      <g fill="none" stroke-linecap="round" stroke="none" transform="rotate(7 50 63)">
        <path d="M76 14 L54.4 28.2" stroke="#3c434f" stroke-width="2.8"/>
        <path d="M76 14 L54.8 31.4" stroke="#3c434f" stroke-width="2.8"/>
        <path d="M76 14 L54.4 28.2" stroke="#dfe5ee" stroke-width="1.5"/>
        <path d="M76 14 L54.8 31.4" stroke="#dfe5ee" stroke-width="1.5"/>
      </g>

      <!-- dust -->
      <g fill="#e8dfc8" stroke="none" opacity="0.55">
        <circle cx="39" cy="57" r="0.7"/>
        <circle cx="61.5" cy="56" r="0.6"/>
        <circle cx="58.5" cy="52.5" r="0.45"/>
        <circle cx="41.5" cy="53" r="0.45"/>
      </g>
    </g>

    <!-- glass highlight -->
    <path d="M34.2 41.5 A15 15 0 0 1 42.5 32.6" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="48" cy="48" r="18.6" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="1.2"/>
  </g>

  <!-- rim -->
  <circle cx="48" cy="48" r="21.25" fill="none" stroke="url(#brass)" stroke-width="4.5"/>
  <circle cx="48" cy="48" r="23.5" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="0.6"/>
</svg>
